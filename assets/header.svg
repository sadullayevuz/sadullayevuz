<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 230" width="736" height="230" role="img" aria-label="Jahonbek Sadullayev">
<style>
.pt{animation:fall linear infinite}
@keyframes fall{0%{transform:translate(var(--x),-20px) rotate(0)}100%{transform:translate(calc(var(--x) + var(--dx)),var(--h)) rotate(400deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.rise{animation:rise 1.1s cubic-bezier(.23,1,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
.sweep{animation:sweep 4s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-260px)}100%{transform:translateX(760px)}}
.wv1{animation:wv 14s linear infinite}.wv2{animation:wv 22s linear infinite reverse}.wv3{animation:wv 32s linear infinite}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-736px)}}
.flt{animation:flt 5s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9ecb"><animate attributeName="stop-color" values="#ff9ecb;#b8a9ff;#ff9ecb" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#b8a9ff"><animate attributeName="stop-color" values="#b8a9ff;#ff9ecb;#b8a9ff" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d6d"/><stop offset=".5" stop-color="#ff9ecb"/><stop offset="1" stop-color="#b8a9ff" stop-opacity="0"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14091f"/><stop offset="1" stop-color="#14091f" stop-opacity="0"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bl"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<clipPath id="c"><path d="M0 0H736V208Q736 230 714 230H22Q0 230 0 208Z"/></clipPath>
