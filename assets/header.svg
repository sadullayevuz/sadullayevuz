<text x="292.0" y="162" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="500" font-size="14.5" fill="#efe9ff" letter-spacing=".6">Gulistan, Uzbekistan</text></g>
<rect x="60" y="196" width="616" height="2" rx="1" fill="url(#ln)" opacity=".7"/>
<g clip-path="url(#c)"><rect class="sweep" x="0" y="195" width="140" height="4" rx="2" fill="url(#sw)"/></g>
</g>
</svg>