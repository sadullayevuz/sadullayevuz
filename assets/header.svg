<g transform="translate(60 150) scale(1)"><path class="tw" style="animation-delay:0.0s" d="M0 -12 L2.6 -2.6 L12 0 L2.6 2.6 L0 12 L-2.6 2.6 L-12 0 L-2.6 -2.6Z" fill="#ff9ecb"/></g><g transform="translate(680 60) scale(1)"><path class="tw" style="animation-delay:0.5s" d="M0 -12 L2.6 -2.6 L12 0 L2.6 2.6 L0 12 L-2.6 2.6 L-12 0 L-2.6 -2.6Z" fill="#b8a9ff"/></g><g transform="translate(640 190) scale(0.8)"><path class="tw" style="animation-delay:1.0s" d="M0 -12 L2.6 -2.6 L12 0 L2.6 2.6 L0 12 L-2.6 2.6 L-12 0 L-2.6 -2.6Z" fill="#ff9ecb"/></g><g transform="translate(120 205) scale(0.7)"><path class="tw" style="animation-delay:1.5s" d="M0 -12 L2.6 -2.6 L12 0 L2.6 2.6 L0 12 L-2.6 2.6 L-12 0 L-2.6 -2.6Z" fill="#b8a9ff"/></g>
<g class="rise" style="animation-delay:.1s"><text x="368.0" y="82" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="800" font-size="50" fill="url(#nm)" filter="url(#gl)">Jahonbek Sadullayev</text></g>
<g class="rise" style="animation-delay:.5s"><text x="368.0" y="120" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="600" font-size="19" fill="#b8a9ff" letter-spacing="5">FULL-STACK DEVELOPER</text></g>
