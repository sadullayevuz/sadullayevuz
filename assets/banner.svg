<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Jahonbek Sadullayev">

<style>
  .blink{transform-origin:0 0;animation:blink 6s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.06)}}
  .look{animation:look 11s ease-in-out infinite}
  @keyframes look{0%,100%{transform:translate(0,0)}25%{transform:translate(-14px,3px)}55%{transform:translate(16px,-3px)}80%{transform:translate(4px,5px)}}
  .tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
  .pt{animation:fall linear infinite;transform:translate(var(--x),-30px)}
  @keyframes fall{0%{transform:translate(var(--x),-30px) rotate(0)}100%{transform:translate(calc(var(--x) + var(--dx)),380px) rotate(420deg)}}
  .orb1{animation:orb 14s ease-in-out infinite}.orb2{animation:orb 18s ease-in-out infinite reverse}
  @keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,30px)}}
  .fl{animation:fl 5s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
